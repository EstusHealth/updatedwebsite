<!DOCTYPE html>
<html lang="en-AU" data-theme="neon-light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Static SEO fallback: most AI/GEO crawlers (GPTBot, ClaudeBot,
       PerplexityBot, CCBot) do not execute JavaScript, so the meta below is
       what they read. Tags carry data-rh="true" so react-helmet-async adopts
       and replaces them at runtime instead of duplicating them. -->
  <title>Estus Health | Neuroaffirming Occupational Therapy Perth</title>
  <meta data-rh="true" name="description" content="A small team of neurodivergent occupational therapists in Perth, with telehealth Australia-wide. Working with autistic adults, PDA profiles, ADHD, and complex health." />
  <meta data-rh="true" name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
  <link data-rh="true" rel="canonical" href="https://www.estushealth.com/" />
  <meta data-rh="true" property="og:type" content="website" />
  <meta data-rh="true" property="og:site_name" content="Estus Health" />
  <meta data-rh="true" property="og:title" content="Estus Health | Neuroaffirming Occupational Therapy Perth" />
  <meta data-rh="true" property="og:description" content="A small team of neurodivergent occupational therapists in Perth, with telehealth Australia-wide. Working with autistic adults, PDA profiles, ADHD, and complex health." />
  <meta data-rh="true" property="og:url" content="https://www.estushealth.com/" />
  <meta data-rh="true" property="og:image" content="https://www.estushealth.com/og-image.png" />
  <meta data-rh="true" property="og:locale" content="en_AU" />
  <meta data-rh="true" name="twitter:card" content="summary_large_image" />

  <!-- Organization schema, readable without JS. The Home page re-injects the
       same entity via Helmet for JS-rendering crawlers. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "MedicalBusiness",
    "name": "Estus Health",
    "description": "Neuroaffirming occupational therapy for autistic adults, teens, and PDA profiles. Gaming-informed therapy, executive function support, NDIS and private clients.",
    "url": "https://www.estushealth.com/",
    "email": "hello@estushealth.com",
    "image": "https://www.estushealth.com/team-photo.jpeg",
    "address": { "@type": "PostalAddress", "addressLocality": "Perth", "addressRegion": "WA", "addressCountry": "AU" },
    "areaServed": "Australia",
    "openingHoursSpecification": {
      "@type": "OpeningHoursSpecification",
      "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
      "opens": "08:00", "closes": "19:00"
    },
    "sameAs": [
      "https://www.instagram.com/estus_health/",
      "https://www.youtube.com/@Estushealth",
      "https://www.facebook.com/profile.php?id=61567995865625",
      "https://www.linkedin.com/company/estus-health"
    ]
  }
  </script>

  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="48x48 32x32 16x16" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#ffffff" />

  <!-- Theme boot: runs before paint to prevent a theme flash. Shared storage
       key and values with the design-system mock for continuity. -->
  <script>
    (function () {
      var VALID = ['neon', 'neon-light'];
      var theme = 'neon-light';
      try {
        var saved = localStorage.getItem('estus-theme');
        if (VALID.indexOf(saved) !== -1) theme = saved;
      } catch (e) { /* storage unavailable: fall through to default */ }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bungee&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Estus clinical brand fonts. Used by the Sensory Profile PDF report
       (the "Estus report style"): Oswald wordmark/headings, Barlow body,
       Barlow Semi Condensed labels. Kept light — only weights the report uses. -->
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>

  <!-- Fallback for crawlers and browsers without JavaScript. Gives HTML-only
       bots real content plus links to every indexable route so the site stays
       discoverable without executing the React bundle. -->
  <noscript>
    <main>
      <h1>Estus Health — Neuroaffirming Occupational Therapy, Perth</h1>
      <p>A small team of neurodivergent occupational therapists in Perth, with telehealth Australia-wide. We work with autistic adults and teens, PDA profiles, ADHD, late-diagnosed adults, and people with complex health such as EDS, POTS, and chronic fatigue. NDIS and private clients welcome. Contact: hello@estushealth.com</p>
      <p>This site works best with JavaScript enabled.</p>
      <!-- Generated at build time from src/lib/routes.js by the noscript-nav
           plugin in vite.config.js. Do not edit by hand. -->
      <nav aria-label="Site pages"><!--NOSCRIPT_NAV--></nav>
    </main>
  </noscript>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
